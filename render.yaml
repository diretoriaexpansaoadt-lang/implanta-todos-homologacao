services:
  - type: web
    name: implanta-todos-homologacao
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: implanta-todos-homologacao-db
          property: connectionString
      - key: STORAGE_DRIVER
        value: s3
      - key: PUBLIC_APP_URL
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM
        sync: false

databases:
  - name: implanta-todos-homologacao-db
    plan: basic-256mb
    databaseName: implanta_todos_hml
    user: implanta_todos_hml
